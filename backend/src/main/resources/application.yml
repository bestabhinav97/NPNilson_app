server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: np-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/np_nilson}
    username: ${SPRING_DATASOURCE_USERNAME:np_db_user}
    password: ${SPRING_DATASOURCE_PASSWORD:np_db_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin:
    seed:
      email: ${SEED_ADMIN_EMAIL:admin@npnilsson.se}
      password: ${SEED_ADMIN_PASSWORD:AdminSecurePassword123!}
      firstname: ${SEED_ADMIN_FIRSTNAME:NP}
      lastname: ${SEED_ADMIN_LASTNAME:Admin}
  session:
    expiration-hours: ${SESSION_EXPIRATION_HOURS:24}
